# ==============================================================================
# JTrac Data Directory Configuration (jtrac.home)
# ==============================================================================
# JTrac resolves the location of its home data directory (jtrac.home) in the
# following strict 4-level priority order (see info.jtrac.config.JtracConfigurer):
#
# 1. Priority 1 (This File):
#    The 'jtrac.home' property defined in this file (WEB-INF/classes/jtrac-init.properties).
#    Example:
#    jtrac.home=/var/jtrac-data
#    jtrac.home=D:/jtrac-data
#
# 2. Priority 2 (Recommended for Production & Containers):
#    The JVM System Property '-Djtrac.home=...' specified at server startup.
#    - Tomcat Linux (bin/setenv.sh):
#      export CATALINA_OPTS="$CATALINA_OPTS -Djtrac.home=/var/jtrac-data"
#    - Tomcat Windows (bin/setenv.bat):
#      set "CATALINA_OPTS=%CATALINA_OPTS% -Djtrac.home=D:/jtrac-data"
#    - Jetty / Standalone:
#      java -Djtrac.home=/var/jtrac-data -jar start.jar
#
# 3. Priority 3:
#    Servlet Context init-parameter 'jtrac.home' in web.xml or Tomcat context XML:
#    <context-param>
#        <param-name>jtrac.home</param-name>
#        <param-value>/var/jtrac-data</param-value>
#    </context-param>
#
# 4. Priority 4 (Default Fallback):
#    If none of the above are defined, JTrac falls back to the user's home directory:
#    System.getProperty("user.home") + "/.jtrac"
#    - When running Tomcat as 'root' on Linux, this defaults to: /root/.jtrac
#    - When running as standard user 'jtrac', this defaults to: /home/jtrac/.jtrac
#    - On Windows, this defaults to: C:\Users\<username>\.jtrac
# ==============================================================================
# jtrac.home=C:/jtrac
