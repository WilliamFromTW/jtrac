<html>
    <body>
        <wicket:extend>
            <div class="heading">
                <wicket:message key="backup_restore.title"/>
            </div>

            <div style="margin: 10px 0;">
                <span wicket:id="feedback"></span>
            </div>

            <!-- 1. System Backup Export Section -->
            <table class="jtrac" style="width: 750px; margin-bottom: 25px;">
                <tr>
                    <th colspan="2" style="font-size: 110%; padding: 8px 12px;">
                        <wicket:message key="backup_restore.export.title"/>
                    </th>
                </tr>
                <tr>
                    <td colspan="2" style="padding: 12px; line-height: 1.6; color: #333; background: #fafafa;">
                        <wicket:message key="backup_restore.export.description"/>
                    </td>
                </tr>
                <tr>
                    <td colspan="2" style="padding: 14px; background: #fff;">
                        <form wicket:id="exportForm">
                            <input type="submit" class="button" wicket:id="exportButton" wicket:message="value:backup_restore.export.btn" style="font-weight: bold; padding: 6px 18px; cursor: pointer;"/>
                        </form>
                    </td>
                </tr>
            </table>

            <!-- 2. System Restore Section -->
            <table class="jtrac" style="width: 750px; margin-bottom: 25px;">
                <tr>
                    <th colspan="2" style="font-size: 110%; padding: 8px 12px; background: #8b0000; color: #fff;">
                        <img src="resources/warning.gif" style="vertical-align: middle; margin-right: 6px;"/>
                        <wicket:message key="backup_restore.restore.title"/>
                    </th>
                </tr>
                <tr>
                    <td colspan="2" style="padding: 12px;">
                        <!-- Safety Warning Box -->
                        <div style="padding: 12px 16px; background-color: #fff3cd; border: 1px solid #ffeeba; border-left: 6px solid #ffc107; border-radius: 4px; color: #856404; margin-bottom: 12px;">
                            <div style="font-weight: bold; font-size: 13px; margin-bottom: 4px;">
                                <wicket:message key="backup_restore.warning.title"/>
                            </div>
                            <div style="font-size: 12px; line-height: 1.5; color: #664d03;">
                                <wicket:message key="backup_restore.warning.text"/>
                            </div>
                        </div>

                        <!-- Restore Upload Form -->
                        <form wicket:id="restoreForm">
                            <table style="width: 100%; border: none;">
                                <tr>
                                    <td class="label" style="width: 220px; vertical-align: middle; padding: 8px;">
                                        <wicket:message key="backup_restore.restore.file"/>
                                    </td>
                                    <td style="padding: 8px;">
                                        <input type="file" wicket:id="file" accept=".zip" style="width: 350px;"/>
                                    </td>
                                </tr>
                                <tr>
                                    <td class="label" style="vertical-align: middle; padding: 8px;">
                                        &nbsp;
                                    </td>
                                    <td style="padding: 8px;">
                                        <label style="color: #b22222; font-weight: bold; cursor: pointer;">
                                            <input type="checkbox" wicket:id="confirmCheck" style="vertical-align: middle; margin-right: 6px;"/>
                                            <wicket:message key="backup_restore.restore.confirm"/>
                                        </label>
                                    </td>
                                </tr>
                                <tr>
                                    <td>&nbsp;</td>
                                    <td style="padding-top: 15px; padding-bottom: 15px;">
                                        <input type="submit" class="button" wicket:id="restoreButton" wicket:message="value:backup_restore.restore.btn" style="font-weight: bold; padding: 6px 18px; cursor: pointer; color: #fff; background-color: #c9302c; border-color: #ac2925;" onclick="return confirm('您即將以備份檔覆蓋目前資料庫，確定要繼續執行還原嗎？');"/>
                                        &nbsp;&nbsp;&nbsp;&nbsp;
                                        <a href="#" wicket:id="cancel" style="color: #666; text-decoration: underline;">
                                            <wicket:message key="cancel"/>
                                        </a>
                                    </td>
                                </tr>
                            </table>
                        </form>
                    </td>
                </tr>
            </table>

        </wicket:extend>
    </body>
</html>
