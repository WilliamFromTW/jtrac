<html>
    <body>        
        <wicket:panel>            
            <form wicket:id="form">
                <span wicket:id="feedback"></span>
                <table class="jtrac">
                    <tr>
                        <th><wicket:message key="item_search_form.resultsPerPage"/></th>
                        <td><select wicket:id="pageSize"/></td>
                        <td/>
                        <th><wicket:message key="item_search_form.showHistory"/></th>                            
                        <td>    
                            <input type="checkbox" wicket:id="showHistory"/>                            
                        </td>
                        <td>
                            <input type="submit" wicket:message="value:search" wicket:id="search"/>
                        </td>
                    </tr>
                </table>
                <table class="jtrac item-search-unified-bar">
                    <tr>
                        <th class="search-title-cell">
                            <wicket:message key="item_search_form.searchText"/>
                            <div class="search-title-hint"><wicket:message key="item_search_form.searchTextHint"/></div>
                        </th>
                        <td class="search-input-cell">
                            <input type="text" wicket:id="searchText" class="item-search-main-input" wicket:message="placeholder:item_search_form.searchPlaceholder"/>
                        </td>
                        <td class="search-summary-toggle-cell">
                            <label class="search-summary-checkbox-label">
                                <input type="checkbox" wicket:id="summaryVisible"/>
                                <span class="summary-toggle-text"><wicket:message key="item_search_form.showSummaryColumn"/></span>
                            </label>
                        </td>
                    </tr>
                </table>
                <table class="jtrac">
                    <tr class="alt">
                        <td align="center"><wicket:message key="item_filter.showColumn"/></td>
                        <td align="center"><wicket:message key="item_filter.expression"/></td>
                        <td align="center">
                            <a href="#" wicket:id="expandAll"><wicket:message key="item_filter.expandAll"/></a>
                        </td>
                    </tr>
                    <tr valign="top" wicket:id="columns">
                        <td class="label">
                            <span wicket:id="columnName"></span>
                            <input type="checkbox" wicket:id="visible"/>
                        </td>                            
                        <td class="alt"><select wicket:id="expression"/></td>
                        <td wicket:id="fragParent"></td>
                    </tr>                    
                </table>
            </form>
            <wicket:fragment wicket:id="multiSelect"><span wicket:id="values"></span></wicket:fragment>            
            <wicket:fragment wicket:id="textField"><input wicket:id="value"/> <input wicket:id="value2"/></wicket:fragment>            
            <wicket:fragment wicket:id="dateField"><input type="date" wicket:id="value"/> <input type="date" wicket:id="value2"/></wicket:fragment>
        </wicket:panel>
    </body>
</html>
