<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html>
    <head>
        <title wicket:id="title"></title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0"/>
        <link rel="shortcut icon" type="image/x-icon" href="favicon.ico"/>
        <script type="text/javascript">
            //<![CDATA[
            (function() {
                try {
                    var t = localStorage.getItem('jtrac-theme') || 'system';
                    var d = document.documentElement;
                    var effectiveTheme = t;
                    if (t === 'system') {
                        var isDark = (window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)').matches : false);
                        effectiveTheme = isDark ? 'dark' : 'light';
                    }
                    d.setAttribute('data-theme', effectiveTheme);
                    d.setAttribute('data-theme-mode', t);
                } catch(e) {}
            })();
            //]]>
        </script>
    </head>
    <body>
        <span wicket:id="individuel"></span><br/>
        <table width="100%" class="jtrac alt">
            <tr>
                <td><a href="app"><wicket:message key="login.home"/></a></td>
                <td align="right">
                    <button type="button" class="login-theme-btn" aria-label="Toggle theme" title="Toggle theme (Light / Dark / System)" onclick="jtracToggleTheme(event)">
                        <span class="theme-icon">🖥️</span>
                    </button>
                </td>
            </tr>
        </table>             
        <form wicket:id="form" class="content">
            <div wicket:id="hide" style="margin-top:3.2em"></div>
            <div wicket:id="feedback"></div>
            <table class="jtrac">
                <tr>
                    <td class="label"><wicket:message key="login.loginName"/></td>
                    <td colspan="2"><input wicket:id="loginName" size="35"/></td>
                </tr>
                <tr>
                    <td class="label"><wicket:message key="login.password"/></td>
                    <td><input type="password" wicket:id="password" size="20"/></td>
                    <td align="right">
                        <input type="submit" wicket:message="value:login.submit"/>                        
                    </td>
                </tr> 
                <tr>
                    <td/>
                    <td colspan="2" align="right">
                        <wicket:message key="login.rememberMe"/>
                        <input type="checkbox" wicket:id="rememberMe"/>
                    </td>
                </tr>                                              
            </table>
        </form>
        <div><br/></div>
        <table width="100%" class="jtrac">
            <tr class="header">
                <td align="right">
                    <i>powered by <a href="https://github.com/WilliamFromTW/jtrac" target="_blank">JTrac <span wicket:id="version"></span></a>, forked from <a href="https://sourceforge.net/projects/j-trac/" target="_blank">JTrac</a> 2.3.3</i>
                </td>
            </tr>
        </table>            
    </body>
</html>
