<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html>
    <head>
        <title wicket:id="title"></title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0"/>
        <link rel="shortcut icon" type="image/x-icon" href="favicon.ico"/>
        <link rel="icon" type="image/x-icon" href="favicon.ico"/>
        <script type="text/javascript">
            //<![CDATA[
            (function() {
                try {
                    var t = localStorage.getItem('jtrac-theme');
                    var d = document.documentElement;
                    if (t === 'light') {
                        d.setAttribute('data-theme', 'light');
                        d.setAttribute('data-theme-mode', 'light');
                    } else if (t === 'dark') {
                        d.setAttribute('data-theme', 'dark');
                        d.setAttribute('data-theme-mode', 'dark');
                    } else {
                        var isDark = (window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)').matches : false);
                        d.setAttribute('data-theme', isDark ? 'dark' : 'light');
                        d.setAttribute('data-theme-mode', 'system');
                    }
                } catch(e) {}
            })();
            function jtracToggleTheme() {
                try {
                    var m = document.documentElement.getAttribute('data-theme-mode') || 'system';
                    var nextMode = (m === 'light') ? 'dark' : ((m === 'dark') ? 'system' : 'light');
                    var d = document.documentElement;
                    if (nextMode === 'light') {
                        localStorage.setItem('jtrac-theme', 'light');
                        d.setAttribute('data-theme', 'light');
                        d.setAttribute('data-theme-mode', 'light');
                    } else if (nextMode === 'dark') {
                        localStorage.setItem('jtrac-theme', 'dark');
                        d.setAttribute('data-theme', 'dark');
                        d.setAttribute('data-theme-mode', 'dark');
                    } else {
                        localStorage.setItem('jtrac-theme', 'system');
                        var isDark = (window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)').matches : false);
                        d.setAttribute('data-theme', isDark ? 'dark' : 'light');
                        d.setAttribute('data-theme-mode', 'system');
                    }
                } catch(e) {}
            }
            if (window.matchMedia) {
                try {
                    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
                        if (document.documentElement.getAttribute('data-theme-mode') === 'system') {
                            document.documentElement.setAttribute('data-theme', e.matches ? 'dark' : 'light');
                        }
                    });
                } catch(e) {}
            }
            //]]>
        </script>
    </head>
    <body>
        <span wicket:id="individuel"></span><br/>
        <span wicket:id="header"></span><br/>
        <div style="clear:both"><br/></div>
        <wicket:child/>
        <div><br/></div>
        <table width="100%" class="jtrac">
            <tr class="header">
                <td align="right">
                    <i>powered by <a href="https://github.com/WilliamFromTW/jtrac" target="_blank">JTrac <span wicket:id="version"></span></a>, forked from <a href="https://sourceforge.net/projects/j-trac/" target="_blank">JTrac</a> 2.3.3</i>
                </td>
            </tr>
        </table>
    </body>
</html>
