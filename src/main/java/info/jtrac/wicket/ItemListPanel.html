<html>
    <body>
        <wicket:panel>
            <table class="jtrac item-list-toolbar" width="100%">
                <tr>
                    <td>
                        <span wicket:id="count"><img src="resources/search.gif" class="nav-link"/><a href="#"><span wicket:id="count"></span> <span wicket:id="recordsFound"></span></a></span>&nbsp;                
                        <span wicket:id="pagination" class="page-links">
                            <span wicket:id="firstOn"><a href="#" wicket:id="firstOn" wicket:message="title:item_list.first"></a></span><span wicket:id="firstOff" wicket:message="title:item_list.first"></span>&nbsp;
                            <span wicket:id="prevOn"><a href="#" wicket:id="prevOn" wicket:message="title:item_list.prev"></a></span><span wicket:id="prevOff" wicket:message="title:item_list.prev"></span>&nbsp;
                            <span wicket:id="pages" class="page-numbers">
                                <span wicket:id="pageOn"><a href="#" wicket:id="pageOn"></a></span><span wicket:id="pageOff"></span>&nbsp;
                            </span>
                            <span wicket:id="nextOn"><a href="#" wicket:id="nextOn" wicket:message="title:item_list.next"></a></span><span wicket:id="nextOff" wicket:message="title:item_list.next"></span>&nbsp;
                            <span wicket:id="lastOn"><a href="#" wicket:id="lastOn" wicket:message="title:item_list.last"></a></span><span wicket:id="lastOff" wicket:message="title:item_list.last"></span>&nbsp;
                            <span wicket:id="pageInfo" class="page-info"><span wicket:id="pageInfoText"></span></span>
                        </span>
                    </td>
                </tr>
            </table>
            <div class="table-responsive item-list-table-container">
                <table class="jtrac jtrac-list" width="100%">
                    <tr class="sortable">
                        <th wicket:id="headings"><span wicket:id="heading"><a href="#" wicket:id="heading"></a></span></th>                    
                    </tr>
                    <tr wicket:id="itemList">
                        <td wicket:id="columns" valign="top"><span wicket:id="column"></span></td>
                    </tr>
                </table>
            </div>
        </wicket:panel>
        <wicket:fragment wicket:id="refId"><a href="#" wicket:id="refId"><span wicket:id="refId"></span></a><span wicket:id="index"></span></wicket:fragment>
        <wicket:fragment wicket:id="detail"><span wicket:id="attachment"></span><span wicket:id="detail"></span></wicket:fragment>
    </body>
</html>
